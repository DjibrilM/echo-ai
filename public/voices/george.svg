<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="49" />
    </clipPath>
    <radialGradient id="baseGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="40%" stop-color="#4338ca" />
      <stop offset="85%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </radialGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="wave2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="wave3" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#4338ca" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="specular" cx="30%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#e0e7ff" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#e0e7ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- Base sphere -->
    <rect width="100" height="100" fill="url(#baseGrad)" />

    <!-- Wave Layer 1: Deep organic swell -->
    <path d="M-10,35 Q20,10 50,40 T110,30 L110,110 L-10,110 Z" fill="url(#wave1)" />

    <!-- Wave Layer 2: Secondary harmonic ripples -->
    <path d="M-10,60 C20,35 40,75 75,50 C95,35 105,65 115,55 L115,110 L-10,110 Z" fill="url(#wave2)" />

    <!-- Wave Layer 3: Audio frequency crest -->
    <path d="M-10,20 Q15,45 45,25 T95,35 Q105,25 115,40 L115,-10 L-10,-10 Z" fill="url(#wave3)" />

    <!-- Swirling sound vortex arcs -->
    <path d="M15,50 A35,35 0 0,1 85,50 A32,30 0 0,1 25,60" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round" opacity="0.4" />
    <path d="M25,45 A25,25 0 0,1 75,45 A22,22 0 0,1 32,55" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M35,48 A15,15 0 0,1 65,48 A12,12 0 0,1 40,55" fill="none" stroke="#e0e7ff" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />

    <!-- Specular highlight for 3D depth -->
    <circle cx="50" cy="50" r="49" fill="url(#specular)" />
    <!-- Outer edge shadow ring -->
    <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="2" />
  </g>
</svg>